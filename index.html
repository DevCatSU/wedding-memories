<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e9">
  <title>Kyungsu & Tamás | Wedding Memories</title>
  <meta name="description" content="Thank you for celebrating our wedding with us.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Italianno&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="watercolor-stage" aria-label="Watercolour illustration of our wedding venue">
<!-- [추가] 이미지 상단 하늘 부분에 겹쳐지는 타이틀 문구 -->
        <div class="wedding-title-overlay">
          <p class="eyebrow-top">OUR 1ST WEDDING ANNIVERSARY</p>
          
          <h1 class="wedding-names">
            <span class="name">KYUNGSU</span>
            <span class="and-script">and</span>
            <span class="name">TAMÁS</span>
          </h1>
        </div>
        <div class="paint-mask">
          <img src="assets/watercolor-wedding.jpg" alt="Watercolour illustration of our vineyard wedding venue">
        </div>
      </div>

      <div class="intro">
        <p class="eyebrow handwriting">Thank you for celebrating with us</p>

        <h1 class="handwritten">
          Our Wedding<br>
          <span>Memories</span>
        </h1>

        <p class="intro-copy">
          We are so happy to share the photographs<br class="desktop-only">
          from our special day with you.
        </p>

        <a
          class="photo-button"
          href="https://drive.google.com/drive/folders/1NmQl3WbX2AGtnzTCiFpPM7VJqGukF4Y6?usp=drive_link
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>View Our Wedding Photos</span>
          <span class="arrow">→</span>
        </a>

        <p class="hint">Tap the button to open our photo album</p>
      </div>
    </section>

    <footer>
      <span>Kyungsu &amp; Tamás</span>
      <span>27 September 2025 · Pécs, Hungary</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
